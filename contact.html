<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact · Eryn Montgomery</title>
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="topnav" aria-label="Sections">
    <a class="home" href="index.html">Eryn Montgomery</a>
    <a href="film.html">Film</a>
    <a href="index.html#unlikely-archivist">Unlikely Archivist</a>
    <a href="index.html#art">Art</a>
    <a href="contact.html" aria-current="page">Contact</a>
  </nav>

  <main class="page contact-page">
    <h1>Let’s talk.</h1>
    <p class="contact-intro">Have a project, opportunity, or idea in mind? Send me a note.</p>

    <form class="contact-form" action="https://formsubmit.co/montgomery.k.eryn@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="New message from erynmontgomery.com">
      <input type="hidden" name="_captcha" value="false">
      <input class="form-honeypot" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">

      <div class="form-field">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
      </div>

      <div class="form-field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>

      <div class="form-field form-field-wide">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="7" required></textarea>
      </div>

      <button type="submit">Send message</button>
    </form>
  </main>
</body>
</html>
