<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5a0a7"><meta name="robots" content="noindex"><title>Molly's claw machine</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#ed8d9e;color:#493b3d;font:16px Georgia,serif}main{max-width:460px;margin:auto;padding:16px 16px max(20px,env(safe-area-inset-bottom));text-align:center}a{color:inherit}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}h1{font-size:26px;margin:0}header a{font-size:25px;text-decoration:none;padding:8px}p{margin:10px 0}.machine{background:#f5a0a7;border:4px solid #493b3d;border-radius:28px 28px 12px 12px;padding:12px;box-shadow:5px 6px 0 #b75171}.sign{background:#fff0c7;border:3px solid #493b3d;border-radius:12px;font-size:24px;padding:8px;margin-bottom:10px;letter-spacing:2px}.glass{background:#fce5ef;border:4px solid #493b3d;position:relative;border-radius:12px;overflow:hidden;aspect-ratio:1.1}svg{display:block;width:100%;height:100%}.controls{display:flex;gap:10px;justify-content:center;padding:14px 0 8px}button{color:#493b3d;font:bold 20px Georgia,serif;border:3px solid #493b3d;border-radius:12px;background:#fff3f6;box-shadow:0 4px 0 #493b3d;min-width:64px;min-height:54px;cursor:pointer;touch-action:none}button:active{transform:translateY(4px);box-shadow:none}button:disabled{opacity:.5;cursor:default}button:focus-visible,a:focus-visible{outline:3px dashed #493b3d;outline-offset:4px}#drop{background:#ffcf75;padding:0 22px}.chute{width:55%;margin:8px auto 0;background:#70535c;border:3px solid #493b3d;border-radius:5px;color:#fff3f6;padding:8px;font-size:14px}#message{min-height:40px;font-size:17px}.collection{background:#fbd3dc;border:3px solid #493b3d;border-radius:14px;padding:12px;margin-top:20px}h2{font-size:20px;margin:0 0 10px}.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.prize{background:#fff3f6;border-radius:9px;padding:5px;font-size:13px}.prize svg{height:62px}.unknown{opacity:.3;filter:grayscale(1)}.hint{font-size:13px}#rope,#claw{stroke:#493b3d;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
</style></head><body><main><header><a href="./" aria-label="Back to Molly's room">⌂</a><h1>plushie palace</h1><span aria-hidden="true">✧</span></header><p>Your dream girl collection starts here.</p><div class="machine"><div class="sign">✧ PICK ME! ✧</div><div class="glass"><svg id="game" viewBox="0 0 360 328" role="img" aria-label="Claw machine with five celebrity plushies"><defs><pattern id="stars" width="55" height="55" patternUnits="userSpaceOnUse"><path d="M15 8v10m-5-5h10" stroke="#edb5ca" stroke-width="2"/></pattern></defs><path fill="url(#stars)" d="M0 0h360v328H0z"/><path d="M0 294h360v34H0" fill="#d697b0"/><path d="M18 24h324" stroke="#b995a6" stroke-width="9"/><g id="toys"></g><path id="rope"/><g id="carriage"><rect x="-15" y="14" width="30" height="20" rx="5" fill="#ffcf75" stroke="#493b3d" stroke-width="4"/></g><g id="claw"><path id="fingers"/></g><g id="held"></g><path d="M12 308h75" stroke="#fff3f6" stroke-width="5"/></svg></div><div class="controls"><button id="left" aria-label="Move claw left">◀</button><button id="drop">DROP!</button><button id="right" aria-label="Move claw right">▶</button></div><div class="chute">prize pickup ↓</div></div><p id="message" role="status" aria-live="polite">Line up the claw, then drop!</p><p class="hint">Hold the arrows · Keyboard: ← → and Space · Free plays forever</p><section class="collection"><h2>Your little friends <span id="count">0 / 5</span></h2><div id="collection" class="shelf"></div></section></main>
<script src="claw.js"></script></body></html>
