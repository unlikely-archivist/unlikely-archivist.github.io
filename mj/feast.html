<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5a0a7"><meta name="robots" content="noindex"><title>Molly's feast catch</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#ed8d9e;color:#493b3d;font:16px Georgia,serif}main{max-width:460px;margin:auto;padding:16px 16px max(20px,env(safe-area-inset-bottom));text-align:center}a{color:inherit}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}h1{font-size:26px;margin:0}header a{display:grid;place-items:center;min-width:44px;min-height:44px;font-size:25px;text-decoration:none}p{margin:10px 0}
.table{background:#f5a0a7;border:4px solid #493b3d;border-radius:28px 28px 12px 12px;padding:12px;box-shadow:5px 6px 0 #b75171}
.board{display:flex;justify-content:space-between;align-items:center;background:#fff0c7;border:3px solid #493b3d;border-radius:12px;font-size:20px;padding:6px 12px;margin-bottom:10px}
#score{font-weight:bold;font-size:24px;min-width:3ch;text-align:left}#best{font-size:15px;opacity:.75}#lives{color:#c8233c;font-size:22px;letter-spacing:2px;min-width:3ch;text-align:right}
.glass{background:#fce5ef;border:4px solid #493b3d;position:relative;border-radius:12px;overflow:hidden;aspect-ratio:4/5}
canvas{display:block;width:100%;height:100%;touch-action:none}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px;background:rgba(252,229,239,.82)}#overlay[hidden]{display:none}
#overlay h2{font-size:28px;margin:0}#overlay p{margin:0;font-size:18px}
.controls{display:flex;gap:10px;justify-content:center;padding:14px 0 4px}
button{color:#493b3d;font:bold 20px Georgia,serif;border:3px solid #493b3d;border-radius:12px;background:#fff3f6;box-shadow:0 4px 0 #493b3d;min-width:64px;min-height:54px;cursor:pointer;touch-action:none}button:active{transform:translateY(4px);box-shadow:none}button:focus-visible,a:focus-visible{outline:3px dashed #493b3d;outline-offset:4px}
#play{background:#ffcf75;padding:0 22px;touch-action:manipulation}
.menu{background:#fbd3dc;border:3px solid #493b3d;border-radius:14px;padding:12px;margin-top:20px}h3{font-size:18px;margin:0 0 8px}.foods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.food{background:#fff3f6;border-radius:9px;padding:6px 4px;font-size:13px}.food canvas{width:48px;height:48px;margin:0 auto 2px;image-rendering:pixelated}.food.bad{background:#e3f0d3}
.hint{font-size:13px}
</style></head><body><main>
<header><a href="./" aria-label="Back to Molly's room">⌂</a><h1>feast catch</h1><span aria-hidden="true">✧</span></header>
<p>Catch the feast in Molly's basket. Watch out for sprouts!</p>
<div class="table">
  <div class="board"><span id="score" aria-label="score">0</span><span id="best">best 0</span><span id="lives" aria-label="3 hearts left">♥♥♥</span></div>
  <div class="glass">
    <canvas id="game" width="1080" height="1350" role="img" aria-label="Molly holding a basket while food falls"></canvas>
    <div id="overlay"><h2 id="title">feast catch</h2><p id="msg">Drop food or catch a sprout and you lose a heart.</p><button id="play">PLAY!</button></div>
  </div>
  <div class="controls"><button id="left" aria-label="Move Molly left">◀</button><button id="right" aria-label="Move Molly right">▶</button></div>
</div>
<p id="message" role="status" aria-live="polite"></p>
<p class="hint">Hold the arrows or drag Molly · Keyboard: ← → and Space</p>
<section class="menu"><h3>On the menu</h3><div class="foods" id="menu"></div></section>
</main>
<script src="molly.js"></script>
<script src="feast.js?v=1"></script></body></html>
