<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5a0a7">
<meta name="robots" content="noindex">
<title>MOLLY</title>
<!-- home-screen app: icon, name, opens full screen -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<meta name="apple-mobile-web-app-title" content="Molly">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#ed8d9e;color:#493b3d;font:16px Georgia,serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
img{-webkit-user-drag:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* one phone-shaped column; on wide screens it just sits in the middle */
.game{display:flex;flex-direction:column;height:100vh;height:100svh;min-height:520px;max-width:min(100%,calc(100svh * .78));margin:0 auto;position:relative;background:#f5a0a7;box-shadow:0 0 0 3px #493b3d}
header{flex:none;padding:max(4px,env(safe-area-inset-top)) 8px 0;text-align:center;background:#f5a0a7;position:relative;z-index:5}
h1{margin:0;font-size:0}
.title-art{display:block;height:clamp(40px,8svh,64px);width:auto;max-width:80%;margin:4px auto;image-rendering:pixelated}

/* the room: the background is cropped, never stretched; things are placed using --ih (rendered image height) */
.stage{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;container-type:size;touch-action:none}
.room{position:absolute;inset:0;background:url("assets/pink-room.jpg") center bottom / cover no-repeat;image-rendering:pixelated}
.stage>*{--ih:max(100cqh,calc(100cqw * 1.3278))}
.doll{--dh:min(calc(var(--ih) * .68),calc(100cqh - var(--ih) * .075 - 20px));position:absolute;left:50%;bottom:calc(var(--ih) * .075);height:var(--dh);width:calc(var(--dh) * 1090 / 1443);margin-left:calc(var(--dh) * -545 / 1443);touch-action:none}
/* the doll box only measures where Molly stands; she and every piece of clothing are drawn into one canvas over the room */
#outfit{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none;z-index:1}
#outfit.pop{animation:pop .22s ease-out}
@keyframes pop{0%{opacity:.85}100%{opacity:1}}
.kitty{position:absolute;height:calc(var(--ih) * .15);aspect-ratio:1202/1309;left:76%;bottom:calc(var(--ih) * .06);cursor:grab;touch-action:none;z-index:6;outline:none}
.kitty img{width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
.kitty.hop{animation:hop .35s ease-out}
@keyframes hop{40%{transform:translateY(-18%)}}
.kitty:focus-visible{outline:2px dashed #493b3d;outline-offset:3px}

/* the closet shelf: always on screen */
.shelf{flex:none;position:relative;z-index:5;background:#fbd3dc;border-top:3px solid #493b3d;padding:6px 8px max(8px,env(safe-area-inset-bottom))}
.hint{margin:0 0 5px;text-align:center;font-size:14px;font-style:italic;opacity:.75}
.slots{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:6px;align-items:stretch}
.slot{position:relative;display:grid;place-items:center;min-height:clamp(58px,10svh,84px);padding:6px;border:3px solid #493b3d;border-radius:10px;background:#fff3f6;box-shadow:0 3px 0 #493b3d;cursor:grab;touch-action:none;font:inherit;color:inherit}
.slot img{max-width:100%;max-height:clamp(42px,8svh,68px);object-fit:contain;image-rendering:pixelated;pointer-events:none}
.slot[aria-pressed="true"]{background:#f7b9c9;box-shadow:none;transform:translateY(3px)}
.slot[aria-pressed="true"] img{opacity:.3}
.slot[aria-pressed="true"]::after{content:"✓";position:absolute;top:2px;right:6px;font-weight:bold}
.reset{min-width:52px;cursor:pointer;font-size:22px;touch-action:manipulation}
.slot:focus-visible{outline:3px dashed #493b3d;outline-offset:2px}

.ghost{position:fixed;z-index:50;pointer-events:none;image-rendering:pixelated;filter:drop-shadow(0 6px 4px rgba(73,59,61,.35));transition:opacity .15s}
.ghost.gone{opacity:0}
</style>
</head>
<body>
<div class="game">
  <header><h1><img class="title-art" src="assets/molly-title.gif" alt="MOLLY"></h1></header>

  <main class="stage" id="stage">
    <div class="room" aria-hidden="true"></div>
    <div class="doll" id="doll" aria-hidden="true"></div>
    <canvas id="outfit" role="img" aria-label="Molly"></canvas>
    <div class="kitty" id="kitty" role="button" tabindex="0" aria-label="Kitty. Drag her around, or use the arrow keys."><img src="assets/kitty.png" alt=""></div>
  </main>

  <nav class="shelf" aria-label="Molly's closet">
    <p class="hint">drag onto Molly ♡ drag back here to put away</p>
    <div class="slots" id="slots">
      <button class="slot reset" id="reset" aria-label="Take everything off">↺</button>
    </div>
  </nav>
  <p class="sr-only" aria-live="polite" id="status"></p>
</div>

<script>
// Everything is measured in doll-base.png pixels (1090 × 1443), with Molly's top-left corner at 0,0.
// Molly is drawn in 12px blocks and so are the clothes; dropped clothes land on her 12px grid
// (x ≡ 10, y ≡ 0 mod 12) so their pixels line up with hers. x, y = where each piece fits her,
// used only by keyboard players. z = stacking order: base 0, hair-front 4 (hair falls over all but the hat).
const DOLL_W = 1090, DOLL_H = 1443, P = 12, GX = 10;
const ITEMS = [
  { id: 'hat',    name: 'pink cowboy hat', src: 'assets/items/hat.png',    x: 274, y: -36,  w: 552, z: 5 },
  { id: 'jacket', name: 'camo jacket',     src: 'assets/items/jacket.png', x: 166, y: 360,  w: 756, z: 3 },
  { id: 'boots',  name: 'buckle boots',    src: 'assets/items/boots.png',  x: 334, y: 1104, w: 444, z: 2 },
];

const stage = document.getElementById('stage');
const doll = document.getElementById('doll');
const canvas = document.getElementById('outfit');
const ctx = canvas.getContext('2d');
const slots = document.getElementById('slots');
const statusEl = document.getElementById('status');
const placed = new Map(); // id → {x, y}: clothes that are out of the closet, wherever they were dropped

// saved outfit (per device; the game works fine without it)
try {
  const saved = JSON.parse(localStorage.getItem('molly-placed')) || {};
  for (const it of ITEMS) if (Array.isArray(saved[it.id])) placed.set(it.id, { x: saved[it.id][0], y: saved[it.id][1] });
} catch {}
const save = () => { try { localStorage.setItem('molly-placed', JSON.stringify(Object.fromEntries([...placed].map(([k, v]) => [k, [v.x, v.y]])))); } catch {} };

const load = src => { const img = new Image(); img.onload = () => paint(); img.src = src; return img; }; // repaint as each picture arrives
const base = load('assets/doll-base.png'), hair = load('assets/hair-front.png');
let hidden = null; // the item being dragged

// view: k = doll pixels per CSS pixel, (ox, oy) = Molly's corner in canvas pixels
let view = { k: 1, ox: 0, oy: 0 };
function measure() {
  const s = stage.getBoundingClientRect(), d = doll.getBoundingClientRect();
  if (!d.height) return;
  const k = DOLL_H / d.height;
  canvas.width = Math.ceil(s.width * k); canvas.height = Math.ceil(s.height * k);
  view = { k, ox: Math.round((d.left - s.left) * k), oy: Math.round((d.top - s.top) * k) };
  paint();
}
new ResizeObserver(measure).observe(stage);

function paint() {
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const layers = [{ z: 0, img: base, x: 0, y: 0, w: DOLL_W }, { z: 4, img: hair, x: 0, y: 0, w: DOLL_W },
    ...ITEMS.filter(it => placed.has(it.id) && it !== hidden).map(it => ({ ...placed.get(it.id), z: it.z, img: it.img, w: it.w }))]
    .sort((a, b) => a.z - b.z);
  for (const L of layers) {
    if (!L.img.complete || !L.img.naturalWidth) continue;
    ctx.drawImage(L.img, view.ox + L.x, view.oy + L.y, L.w, L.w * L.img.naturalHeight / L.img.naturalWidth);
  }
}

// ---- load the clothes and build the closet shelf ----
for (const it of ITEMS) {
  const img = load(it.src);
  it.img = img;
  // keep the pixels so you can only grab a piece where it is actually visible
  img.decode().then(() => {
    const c = document.createElement('canvas');
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    const cx = c.getContext('2d', { willReadFrequently: true });
    cx.drawImage(img, 0, 0);
    it.alpha = (u, v) => cx.getImageData(Math.min(c.width - 1, u * c.width) | 0, Math.min(c.height - 1, v * c.height) | 0, 1, 1).data[3];
  }).catch(() => {});

  const b = document.createElement('button');
  b.className = 'slot';
  b.innerHTML = `<img src="${it.src}" alt="">`;
  b.setAttribute('aria-label', it.name);
  slots.insertBefore(b, document.getElementById('reset'));
  it.slot = b;
}

function render(popped) {
  for (const it of ITEMS) it.slot.setAttribute('aria-pressed', placed.has(it.id));
  paint();
  if (popped) { canvas.classList.remove('pop'); void canvas.offsetWidth; canvas.classList.add('pop'); }
  save();
}

// ---- drag & drop: clothes stay exactly where you drop them; drop one on the shelf to put it away ----
const TAP = 8;
const size = it => ({ w: it.w / view.k, h: (it.w / view.k) * it.img.naturalHeight / it.img.naturalWidth }); // CSS px
function boxOf(it) { // where a placed piece is on screen
  const s = stage.getBoundingClientRect(), p = placed.get(it.id), { w, h } = size(it);
  return { L: s.left + (view.ox + p.x) / view.k, T: s.top + (view.oy + p.y) / view.k, W: w, H: h };
}
function itemAt(x, y) { // topmost placed piece with visible pixels under the finger
  return ITEMS.filter(it => placed.has(it.id)).sort((a, b) => b.z - a.z).find(it => {
    const { L, T, W, H } = boxOf(it), u = (x - L) / W, v = (y - T) / H;
    if (u < 0 || v < 0 || u > 1 || v > 1) return false;
    try { return it.alpha ? it.alpha(u, v) > 40 : true; } catch { return true; } // e.g. opened from a file:// URL
  });
}

let drag = null;
function startDrag(e, it) {
  if (e.button > 0 || drag) return;
  e.preventDefault();
  drag = { it, id: e.pointerId, x0: e.clientX, y0: e.clientY, moved: false, ghost: null };
  e.currentTarget.setPointerCapture(e.pointerId);
}
function moveDrag(e) {
  if (!drag || drag.id !== e.pointerId) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < TAP) return;
  const { it } = drag;
  if (!drag.moved) {
    drag.moved = true;
    const { w, h } = size(it);
    const g = drag.ghost = new Image();
    g.src = it.src; g.className = 'ghost'; g.alt = '';
    g.style.width = w + 'px';
    document.body.appendChild(g);
    if (placed.has(it.id)) { // pick it up from where it is
      const { L, T } = boxOf(it);
      drag.ox = drag.x0 - L; drag.oy = drag.y0 - T;
      hidden = it; paint();
    } else { drag.ox = w / 2; drag.oy = h / 2; }
  }
  drag.ghost.style.left = e.clientX - drag.ox + 'px';
  drag.ghost.style.top = e.clientY - drag.oy + 'px';
}
function endDrag(e, cancelled) {
  if (!drag || drag.id !== e.pointerId) return;
  const { it, moved, ghost, ox, oy } = drag;
  drag = null;
  if (ghost) { ghost.classList.add('gone'); setTimeout(() => ghost.remove(), 160); }
  hidden = null;
  if (cancelled || !moved) { paint(); return; }
  const s = stage.getBoundingClientRect();
  if (e.clientY > s.bottom) { // dropped on the shelf: back in the closet
    placed.delete(it.id); render();
    statusEl.textContent = `Put the ${it.name} away.`;
    return;
  }
  // keep the finger's spot inside the room, then land on Molly's pixel grid
  const fx = Math.max(s.left, Math.min(s.right, e.clientX)), fy = Math.max(s.top, Math.min(s.bottom, e.clientY));
  const x = (fx - ox - s.left) * view.k - view.ox, y = (fy - oy - s.top) * view.k - view.oy;
  placed.set(it.id, { x: Math.round((x - GX) / P) * P + GX, y: Math.round(y / P) * P });
  render(true);
  statusEl.textContent = `Moved the ${it.name}.`;
}

for (const it of ITEMS) {
  const b = it.slot;
  b.addEventListener('pointerdown', e => startDrag(e, it));
  b.addEventListener('pointermove', moveDrag);
  b.addEventListener('pointerup', e => endDrag(e, false));
  b.addEventListener('pointercancel', e => endDrag(e, true));
  b.addEventListener('click', e => { // keyboard only (Enter/Space): put it on her, or away
    if (e.detail !== 0) return;
    placed.has(it.id) ? placed.delete(it.id) : placed.set(it.id, { x: it.x, y: it.y });
    render(true);
  });
}
canvas.addEventListener('pointerdown', e => { const it = itemAt(e.clientX, e.clientY); if (it) startDrag(e, it); });
canvas.addEventListener('pointermove', moveDrag);
canvas.addEventListener('pointerup', e => endDrag(e, false));
canvas.addEventListener('pointercancel', e => endDrag(e, true));

document.getElementById('reset').addEventListener('click', () => {
  placed.clear(); render();
  statusEl.textContent = 'Everything is back in the closet.';
});

// ---- kitty: free to wander the room, but never off it ----
const kitty = document.getElementById('kitty');
let kd = null;
function placeKitty(left, top) {
  const s = stage.getBoundingClientRect(), k = kitty.getBoundingClientRect();
  left = Math.max(0, Math.min(s.width - k.width, left));
  top = Math.max(0, Math.min(s.height - k.height, top));
  kitty.style.left = left / s.width * 100 + '%';
  kitty.style.top = top / s.height * 100 + '%';
  kitty.style.bottom = 'auto';
}
kitty.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  e.preventDefault();
  const k = kitty.getBoundingClientRect();
  kd = { id: e.pointerId, ox: e.clientX - k.left, oy: e.clientY - k.top, x0: e.clientX, y0: e.clientY };
  kitty.setPointerCapture(e.pointerId);
});
kitty.addEventListener('pointermove', e => {
  if (!kd || kd.id !== e.pointerId) return;
  const s = stage.getBoundingClientRect();
  placeKitty(e.clientX - s.left - kd.ox, e.clientY - s.top - kd.oy);
});
const kittyUp = e => {
  if (!kd || kd.id !== e.pointerId) return;
  if (Math.hypot(e.clientX - kd.x0, e.clientY - kd.y0) < TAP) { kitty.classList.remove('hop'); void kitty.offsetWidth; kitty.classList.add('hop'); }
  kd = null;
};
kitty.addEventListener('pointerup', kittyUp);
kitty.addEventListener('pointercancel', kittyUp);
kitty.addEventListener('keydown', e => {
  const m = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (!m) return;
  e.preventDefault();
  const s = stage.getBoundingClientRect(), k = kitty.getBoundingClientRect(), step = e.shiftKey ? 24 : 6;
  placeKitty(k.left - s.left + m[0] * step, k.top - s.top + m[1] * step);
});

measure();
render();
</script>
</body>
</html>
