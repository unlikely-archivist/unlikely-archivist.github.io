<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eryn Montgomery</title>
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #fff;
      color: #111;
      font-family: "IBM Plex Sans", sans-serif;
    }

    .topnav {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 1.5rem;
      max-width: 64rem;
      margin: 0 auto;
      padding: 1.5rem 1rem;
    }
    .topnav a { color: #111; text-decoration: none; font-size: 0.9rem; }
    .topnav a:hover { text-decoration: underline; }

    .intro {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      max-width: 64rem;
      margin: 0 auto;
      padding: 6rem 1rem 2rem;
    }
    .intro h1 { flex: 1 1 18rem; margin: 0; font-weight: 400; font-size: 1.4rem; line-height: 1.1; }
    .intro h1 span { display: block; font-family: "UnifrakturMaguntia", serif; font-size: clamp(2.25rem, 5.5vw, 4.4rem); }

    /* Framed portrait: three stacked layers. Change these to restyle it. */
    .portrait {
      --frame-color: #000;
      --frame-fill: transparent;  /* background inside the frame: any color, gradient, or url() */
      --zoom: 0.7;                /* portrait width relative to the frame's inner width */

      position: relative;
      flex: 0 1 26rem;
      width: 100%;
      max-width: 26rem;
      aspect-ratio: 1576 / 1624;
    }
    .portrait .clip,
    .portrait .frame {
      position: absolute;
      inset: 0;
      -webkit-mask: var(--mask) center / 100% 100% no-repeat;
      mask: var(--mask) center / 100% 100% no-repeat;
    }
    .portrait .clip { --mask: url(assets/portrait-frame-inner.png); background: var(--frame-fill); }
    .portrait .frame { --mask: url(assets/portrait-frame-black.png); background: var(--frame-color); }
    /* 83.12% = frame's inner width, 49.62% = its center, 7.76% = sits just below its inner bottom edge */
    .portrait img {
      position: absolute;
      width: calc(83.12% * var(--zoom));
      left: calc(49.62% - 41.56% * var(--zoom));
      bottom: 7.76%;
      height: auto;
    }
  </style>
</head>
<body>
  <nav class="topnav" aria-label="Sections">
    <a href="#film">Film</a>
    <a href="#unlikely-archivist">Unlikely Archivist</a>
    <a href="#art">Art</a>
  </nav>

  <section class="intro">
    <h1>Hi, I'm <span>Eryn Montgomery</span></h1>
    <div class="portrait">
      <div class="clip"><img src="assets/eryn-portrait.png" alt="Eryn Montgomery" width="1086" height="1448"></div>
      <div class="frame"></div>
    </div>
  </section>
</body>
</html>
